# Посредник Telegram (Cloudflare Worker). Секретов здесь нет:
# PROXY_KEY кладётся командой  npx wrangler secret put PROXY_KEY
name = "rightplace-tg"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ORIGIN_HOOK_URL = "https://api.rightplace-game.ru/bot/webhook"
ORIGIN_ART_URL = "https://rightplace-game.ru/bot"

# Картинки бота — прямо в воркере (их качает Telegram по ссылке /art/<файл>).
# run_worker_first: каждый запрос сначала идёт в код — /tg, /hook и проверки
# остаются в силе, а сами файлы по корню воркера не раздаются.
[assets]
directory = "../../public/bot"
binding = "ASSETS"
run_worker_first = true
